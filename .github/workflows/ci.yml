name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run tests
        run: |
          PYTHONPATH=src pytest tests/ -q --tb=short

      - name: Import check (API surface)
        run: |
          PYTHONPATH=src python -c "from vera_engine.api import app; print('API import OK')"

      - name: Import check (Ledger)
        run: |
          PYTHONPATH=src python -c "from vera_engine.ledger import Ledger; print('Ledger import OK')"
